<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="carGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Fundo Circular com Borda de Pulso -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e293b" stroke-width="8"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#pulse)" stroke-width="8" stroke-dasharray="140 40 80 40" stroke-linecap="round"/>

  <!-- Silhueta Esportiva do Carro -->
  <g transform="translate(76, 150)">
    <!-- Chassi & Teto -->
    <path d="M 40 140 
             C 70 135, 95 105, 125 70 
             C 155 35, 195 20, 245 20 
             C 285 20, 310 40, 325 75 
             L 345 135 
             L 355 140
             C 365 145, 365 160, 350 165
             L 320 165
             C 310 145, 280 130, 250 130
             C 220 130, 190 145, 180 165
             L 120 165
             C 110 145, 80 130, 50 130
             C 35 130, 18 135, 10 145
             L 10 150
             C 5 155, 15 165, 30 165
             Z" fill="url(#carGlow)"/>

    <!-- Janelas -->
    <path d="M 135 75 
             C 160 48, 190 38, 235 38 
             L 235 78 
             L 135 78 Z" fill="#0b0f17" opacity="0.85"/>
    <path d="M 248 38 
             C 278 38, 298 52, 310 75 
             L 248 75 Z" fill="#0b0f17" opacity="0.85"/>

    <!-- Rodas Estilizadas -->
    <circle cx="50" cy="165" r="26" fill="#0f172a" stroke="#06b6d4" stroke-width="6"/>
    <circle cx="50" cy="165" r="10" fill="#38bdf8"/>
    <circle cx="250" cy="165" r="26" fill="#0f172a" stroke="#10b981" stroke-width="6"/>
    <circle cx="250" cy="165" r="10" fill="#34d399"/>
  </g>

  <!-- Linha de Pulso / Telemetria Cardíaca do Motor -->
  <path d="M 40 370 
           L 150 370 
           L 180 340 
           L 210 420 
           L 250 290 
           L 290 410 
           L 320 355 
           L 350 370 
           L 472 370" 
        fill="none" 
        stroke="url(#pulse)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Ponto de Destaque no Pulso -->
  <circle cx="250" cy="290" r="10" fill="#ffffff" filter="drop-shadow(0 0 8px #10b981)"/>

  <!-- Nome OpenOBD Pulse -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    OPEN<tspan fill="#06b6d4">OBD</tspan> <tspan fill="#10b981">PULSE</tspan>
  </text>
</svg>